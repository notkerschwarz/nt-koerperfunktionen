<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Körperfunktionen trainieren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
body{margin:0}

/* Layout: Kopfband mit Logo rechts, Seitennavigation links (Themen 3.2–3.10), Inhalt rechts; auf dem Handy Navigation als Klappmenü */
:root{
  --bg:#f4f7f2; --surface:#ffffff; --fg:#1d2a24; --muted:#5b6b62; --line:#d9e2d6;
  --band:#1f4d3f; --band-fg:#ffffff; --accent:#8cb21f; --accent-ink:#4d6b00; --accent-soft:#eef5d9;
  --ok:#2e7d32; --ok-soft:#e5f3e6; --bad:#c62828; --bad-soft:#fbe7e7; --chip:#e8efe5; --org1:#d9917f; --org2:#f2c9b8; --org3:#b98a52; --org4:#efd27a; --org5:#9cc46a; --mk:#1f4d3f; --mk-fg:#ffffff;
  --f-head:"Bitter", Georgia, serif; --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a16; --surface:#1b2520; --fg:#e6eee8; --muted:#a3b3aa; --line:#2e3c35;
  --band:#163a2f; --band-fg:#f2f7f3; --accent:#a8cf3a; --accent-ink:#c6e66b; --accent-soft:#26331a;
  --ok:#7fd483; --ok-soft:#1c3320; --bad:#ff8a80; --bad-soft:#3a1e1e; --chip:#24302a; --org1:#b86f60; --org2:#8f6a5c; --org3:#a8844f; --org4:#c4a35c; --org5:#7fa356; --mk:#a8cf3a; --mk-fg:#1d2a24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a16; --surface:#1b2520; --fg:#e6eee8; --muted:#a3b3aa; --line:#2e3c35;
  --band:#163a2f; --band-fg:#f2f7f3; --accent:#a8cf3a; --accent-ink:#c6e66b; --accent-soft:#26331a;
  --ok:#7fd483; --ok-soft:#1c3320; --bad:#ff8a80; --bad-soft:#3a1e1e; --chip:#24302a; --org1:#b86f60; --org2:#8f6a5c; --org3:#a8844f; --org4:#c4a35c; --org5:#7fa356; --mk:#a8cf3a; --mk-fg:#1d2a24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
header.top{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-head);font-size:1.3rem;margin:0;line-height:1.2;text-wrap:balance}
.top .sub{font-size:.8rem;opacity:.85;letter-spacing:.04em}
.top .ttl{flex:1;min-width:0}
.logo{background:#ffffff;border-radius:8px;padding:5px 9px;display:flex;align-items:center;flex-shrink:0}
.logo img{height:30px;width:auto;display:block}
.menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--band-fg);border-radius:6px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px 10px;font-weight:700}
.side a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:.95rem}
.side a .n{font-size:.75rem;font-weight:700;min-width:30px;height:22px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-variant-numeric:tabular-nums}
.side a:hover{background:var(--chip)}
.side a.on{background:var(--band);color:var(--band-fg)}
.side a.on .n{background:var(--accent);color:#1d2a24}
main{min-width:0}
main h2{font-family:var(--f-head);font-size:1.75rem;margin:0 0 6px;line-height:1.2;text-wrap:balance;color:var(--fg)}
main h3{font-family:var(--f-head);font-size:1.2rem;margin:0 0 10px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:600;background:none;border:none;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.goalbox{border-left:5px solid var(--accent)}
.theory{max-width:72ch}
.theory p{margin:0 0 12px}
.theory ul{margin:0 0 12px;padding-left:22px}
.theory b{color:var(--accent-ink)}
.merk{background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin:14px 0}
.merk::before{content:"Merke";display:block;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}
.tblwrap{overflow-x:auto;margin:10px 0 14px}
table.t{border-collapse:collapse;min-width:420px;width:100%;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--chip)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 14px}
.flow span{background:var(--chip);border-radius:6px;padding:5px 10px;font-size:.92rem;font-weight:600}
.flow i{color:var(--muted);font-style:normal}
.goal{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.goal input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent-ink);flex-shrink:0}
.goal .txt{flex:1;min-width:0}
.goal .meta{font-size:.8rem;color:var(--muted)}
.goal a.go{font-size:.85rem;font-weight:600;color:var(--accent-ink);text-decoration:none;white-space:nowrap;padding:4px 9px;border-radius:6px;background:var(--accent-soft)}
.goals{display:flex;flex-direction:column;gap:8px}
.stars{color:var(--accent-ink);font-weight:700;letter-spacing:1px}
.prog{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.prog div{height:100%;background:var(--accent);width:0;transition:width .3s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.q .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--muted)}
.tag.b{background:var(--accent-soft);color:var(--accent-ink)}
.q .qt{font-weight:600;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;align-items:center}
.match select{font:inherit;font-size:.95rem;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.match select.ok{border-color:var(--ok);background:var(--ok-soft)}
.match select.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{font:inherit;font-weight:600;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;background:var(--band);color:var(--band-fg)}
.btn.sec{background:var(--chip);color:var(--fg)}
.btn:focus-visible,.side a:focus-visible,.tabs button:focus-visible,.goal a.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{margin-top:10px;padding:9px 12px;border-radius:7px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);color:var(--fg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--fg);border-left:4px solid var(--bad)}
.write textarea{width:100%;min-height:90px;font:inherit;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.sol{margin-top:10px;background:var(--accent-soft);border-radius:8px;padding:10px 14px}
.score{font-family:var(--f-head);font-size:2.2rem;font-variant-numeric:tabular-nums}
.foot{font-size:.82rem;color:var(--muted);margin-top:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--accent)}
.card .n{font-size:.8rem;color:var(--accent-ink);font-weight:700}
.card b{font-family:var(--f-head)}
.card .m{font-size:.82rem;color:var(--muted)}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;margin:0 0 12px;max-width:440px}
.fig svg{display:block;width:100%;height:auto}
.fig .body{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4}
.fig .o{fill:var(--org2);stroke:var(--fg);stroke-width:1.5}
.fig .o2{fill:var(--org2);stroke:var(--fg);stroke-width:1.2}
.fig .liver{fill:var(--org1);stroke:var(--fg);stroke-width:1.5}
.fig .stom{fill:var(--org2);stroke:var(--fg);stroke-width:1.5}
.fig .gall{fill:var(--org5);stroke:var(--fg);stroke-width:1.5}
.fig .panc{fill:var(--org4);stroke:var(--fg);stroke-width:1.5}
.fig .colon{fill:none;stroke:var(--org3);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.fig .small{fill:none;stroke:var(--org4);stroke-width:7;stroke-linecap:round}
.fig .wall{fill:var(--org2);stroke:var(--fg);stroke-width:1.5}
.fig .villus{fill:var(--org2);stroke:var(--fg);stroke-width:1.2}
.fig .vessel{fill:none;stroke:var(--bad);stroke-width:2}
.fig .wallb{fill:var(--chip);stroke:var(--fg);stroke-width:5}
.fig .flag{fill:none;stroke:var(--fg);stroke-width:2.5}
.fig .dna{fill:none;stroke:var(--accent-ink);stroke-width:3}
.fig .capsid{fill:var(--chip);stroke:var(--fg);stroke-width:5}
.fig .spike{stroke:var(--fg);stroke-width:2}
.fig .knob{fill:var(--org4);stroke:var(--fg);stroke-width:1.5}
.fig .food{fill:var(--org3);opacity:.55}
.fig .hyph{fill:none;stroke:var(--fg);stroke-width:2}
.fig .spor{fill:var(--chip);stroke:var(--fg);stroke-width:2}
.fig .sp{fill:var(--fg)}
.fig .rbc{fill:var(--org1);stroke:var(--fg);stroke-width:1.5}
.fig .agA{fill:var(--accent);stroke:var(--fg);stroke-width:1}
.fig .agB{fill:var(--band);stroke:var(--fg);stroke-width:1}
.fig .lg,.fig .lg2{fill:var(--fg);font:600 13px var(--f-body)}
.fig .arr{stroke:var(--muted);stroke-width:2.5}
.fig .ahd{fill:var(--muted)}
.fig .box{fill:var(--chip);stroke:var(--fg);stroke-width:1.5}
.fig .cell{fill:var(--org2);stroke:var(--muted);stroke-width:1}
.fig .tum{fill:var(--bad);opacity:.75;stroke:var(--fg);stroke-width:1}
.fig .caps{fill:none;stroke:var(--fg);stroke-width:3}
.fig .vesl{stroke:var(--bad);stroke-width:10;opacity:.35}
.fig .p1{fill:#9fd3f0}.fig .p2{fill:#a6d36b}.fig .p3{fill:#f2cf6b}.fig .p4{fill:#e9a36c}.fig .p5{fill:#e8d58c}.fig .p6{fill:#d98a8a}
.fig [class^="p"]{stroke:var(--fg);stroke-width:1.2}
.fig .ld{stroke:var(--fg);stroke-width:1.2}
.fig .dot{fill:var(--fg)}
.fig .mk{fill:var(--mk);stroke:var(--surface);stroke-width:2}
.fig .mkt{fill:var(--mk-fg);font:700 13px var(--f-body)}
.fig .mkt2{fill:#1d2a24;font:700 16px var(--f-body)}
.fig .box+.mkt2{fill:var(--fg)}
.pre{background:var(--surface);border:1px dashed var(--muted);border-radius:8px;padding:10px 14px;margin:0 0 12px;font-size:.93rem;max-width:520px}
.pre .cap{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.pre table{border-collapse:collapse;width:100%}
.pre td,.pre th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left}
.round{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:.92rem}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  .menu-btn{display:inline-block}
  nav.side{position:static;display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
  nav.side.open{display:flex}
  .top h1{font-size:1.05rem}
  .logo img{height:24px}
  .match{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

t32:{nr:'3.2',title:'Die Hauptnährstoffe',book:'S. 48–49',
theory:`<p>Unsere Nahrung besteht zum grössten Teil aus drei <b>Hauptnährstoffen</b>: Kohlenhydrate, Fette und Proteine (Eiweisse). Dazu kommen <b>Ergänzungsstoffe</b>: Vitamine, Mineralstoffe und Ballaststoffe.</p>
<div class="tblwrap"><table class="t"><tr><th>Hauptnährstoff</th><th>Aufgabe im Körper</th><th>Kommt vor in</th></tr>
<tr><td><b>Kohlenhydrate</b> (Zuckerstoffe)</td><td>Energiequelle</td><td>Brot, Teigwaren, Kartoffeln, Reis, Süsses</td></tr>
<tr><td><b>Fette</b></td><td>Energiequelle (die energiereichsten Nährstoffe), nötig für die Aufnahme bestimmter Vitamine</td><td>Öl, Butter, Nüsse, Avocado, Fisch, Wurst, Käse</td></tr>
<tr><td><b>Proteine</b> (Eiweisse)</td><td>Baustoff: Haut, Haare, Nägel, Muskeln; ausserdem Enzyme, Hormone, Abwehrstoffe</td><td>Fleisch, Fisch, Milch, Eier, Hülsenfrüchte (Bohnen, Linsen, Erbsen)</td></tr></table></div>
<p><b>Kohlenhydrate</b> gibt es als Einfachzucker (Traubenzucker, Fruchtzucker), Zweifachzucker (Haushaltszucker) und Mehrfachzucker (Stärke = lange Kette aus Traubenzucker). <b>Fette</b> bestehen aus einem wasserlöslichen Teil und drei Fettsäuren. <b>Proteine</b> sind Ketten aus <b>Aminosäuren</b>.</p>
<p><b>Essenziell</b> heisst: Der Körper kann den Stoff nicht selbst herstellen. Essenzielle Fettsäuren und Aminosäuren müssen wir mit der Nahrung aufnehmen.</p>
<p><b>Nährstoffnachweise</b> (AM 3.2): Mit Nachweismitteln zeigt man, ob ein Nahrungsmittel Stärke, Traubenzucker, Proteine oder Fett enthält. Für Stärke verwendet man Iod-Kaliumiodid-Lösung: Sie färbt sich bei Stärke blauschwarz. Fett hinterlässt auf Papier einen durchscheinenden Fettfleck.</p>
<p><b>Energie</b> wird in Kilojoule (kJ) oder Kilokalorien (kcal) angegeben, meist pro 100 g. Wer vergleichen will, muss immer die <b>gleiche Menge</b> vergleichen (z. B. beide pro 100 g).</p>
<div class="merk">1 g Fett liefert mehr als doppelt so viel Energie wie 1 g Kohlenhydrate. Zu viel Fett und Kohlenhydrate wandelt der Körper in Depotfett um.</div>`,

{t:'tf',b:'Wissen',g:2,q:'Fette sind die energiereichsten Nährstoffe.',a:true,e:'1 g Fett liefert mehr als doppelt so viel Energie wie 1 g Kohlenhydrate.'},

t33:{nr:'3.3',title:'Der Weg der Nahrung',book:'S. 50–53',
theory:`<p>Bei der <b>Verdauung</b> wird die Nahrung in kleinste Bausteine zerlegt. Nur so können die Nährstoffe ins Blut gelangen.</p>
<div class="flow" aria-label="Weg der Nahrung"><span>Mund</span><i>→</i><span>Speiseröhre</span><i>→</i><span>Magen</span><i>→</i><span>Dünndarm (mit Zwölffingerdarm)</span><i>→</i><span>Dickdarm</span><i>→</i><span>Mastdarm</span><i>→</i><span>After</span></div>
<div class="tblwrap"><table class="t"><tr><th>Organ</th><th>Was passiert?</th></tr>
<tr><td><b>Mund</b></td><td>Zähne zerkleinern, Speichel macht den Brei gleitfähig. Ein Enzym im Speichel zerlegt <b>Stärke</b> in Zucker-Bausteine.</td></tr>
<tr><td><b>Speiseröhre</b></td><td>Muskelschlauch; wellenförmige Bewegungen transportieren den Brei in den Magen.</td></tr>
<tr><td><b>Magen</b></td><td>Knetet den Brei. Magensaft: <b>Salzsäure</b> tötet Bakterien, <b>Schleim</b> schützt die Magenwand, ein <b>Enzym</b> zerlegt Proteine.</td></tr>
<tr><td><b>Dünndarm</b></td><td>Galle (aus Leber, gespeichert in der Gallenblase) und Bauchspeichel kommen dazu und zerlegen Fette, Proteine und Kohlenhydrate. Hier werden die Nährstoffe <b>ins Blut aufgenommen</b>.</td></tr>
<tr><td><b>Dickdarm</b></td><td>Holt <b>Wasser</b> aus den unverdaulichen Resten zurück. Die Reste werden eingedickt und als Kot über den After abgegeben.</td></tr></table></div>
<p><b>Enzyme</b> sind Werkzeuge des Körpers aus Proteinen. Sie sorgen dafür, dass chemische Reaktionen (z. B. das Zerlegen von Stärke) schneller ablaufen.</p>
<p><b>Oberflächenvergrösserung:</b> Die Innenwand des Dünndarms hat <b>Darmfalten</b> und darauf unzählige <b>Darmzotten</b>. So wird die Oberfläche riesig, und es können viel mehr Nährstoffe gleichzeitig ins Blut gelangen. Modell (AM 3.4): Ein gefaltetes Tuch passt in eine kleine Schachtel, hat aber eine viel grössere Fläche als der Schachtelboden.</p>
<div class="merk">Grosse Oberfläche = mehr Platz für die Aufnahme der Nährstoffe ins Blut.</div>`,
ex:[
{t:'match',b:'Wissen',g:5,q:'Bringe den Weg der Nahrung in die richtige Reihenfolge.',l:['1. Station','2. Station','3. Station','4. Station','5. Station'],o:['Mund','Speiseröhre','Magen','Dünndarm','Dickdarm'],a:[0,1,2,3,4]},
{t:'match',b:'Verstehen',g:6,q:'Ordne die Aufgabe dem richtigen Organ zu.',l:['Wasser wird zurückgewonnen','Stärke wird zerlegt','Salzsäure tötet Bakterien','Nährstoffe gehen ins Blut'],o:['Mund','Magen','Dünndarm','Dickdarm'],a:[3,0,1,2]},
{t:'mc',b:'Verstehen',g:6,q:'Wozu dient der Schleim im Magen?',o:['Er schützt die Magenwand vor der Salzsäure.','Er zerlegt Fette.','Er nimmt Nährstoffe auf.','Er tötet Bakterien.'],a:0},
{t:'tf',b:'Wissen',g:6,q:'Die Galle wird in der Gallenblase gebildet.',a:false,e:'Die Galle wird in der Leber gebildet und in der Gallenblase gespeichert.'},
{t:'mc',b:'Analysieren',g:7,q:'Warum hat der Dünndarm Darmfalten und Darmzotten?',o:['Sie vergrössern die Oberfläche, damit mehr Nährstoffe ins Blut gelangen.','Sie machen den Darm kürzer.','Sie halten Bakterien fest.','Sie bilden die Galle.'],a:0},
{t:'mc',b:'Anwenden',g:6,q:'Lena hat Durchfall. Welches Organ arbeitet vermutlich nicht richtig?',o:['Der Dickdarm holt zu wenig Wasser zurück.','Die Speicheldrüsen bilden zu wenig Speichel.','Die Speiseröhre ist zu kurz.','Der Magen bildet zu viel Schleim.'],a:0}
],
w:[{q:'Beschreibe den Weg eines Stücks Brot vom Mund bis zum After. Nenne bei jedem Organ, was passiert.',a:'Mund: kauen, Speichel, Stärke wird zerlegt → Speiseröhre: Transport durch Muskelbewegungen → Magen: kneten, Salzsäure, Proteine werden zerlegt → Dünndarm: Galle und Bauchspeichel, Nährstoffe gehen ins Blut → Dickdarm: Wasser wird zurückgewonnen → Mastdarm/After: Kot wird abgegeben.'},{q:'Erkläre mit dem Modell «gefaltetes Tuch in einer Schachtel», warum der Dünndarm eine grosse Oberfläche braucht.',a:'Das Tuch ist gefaltet und hat deshalb viel mehr Fläche als der Boden der Schachtel. Genauso hat der Dünndarm durch Falten und Zotten eine riesige Oberfläche. So können viele Nährstoffe gleichzeitig ins Blut übergehen.'}]},
t34:{nr:'3.4',title:'Krankheitserreger',book:'S. 54–55',
theory:`<div class="tblwrap"><table class="t"><tr><th></th><th>Viren</th><th>Bakterien</th><th>Pilze</th></tr>
<tr><td><b>Grösse</b></td><td>0,02–0,3 µm (am kleinsten)</td><td>0,2–10 µm</td><td>2–10 µm (Zellen)</td></tr>
<tr><td><b>Aufbau</b></td><td>Proteinhülle mit Erbmaterial, <b>keine Zelle</b>, kein Stoffwechsel</td><td>eine Zelle, Erbmaterial frei in der Zelle</td><td>eine oder viele Zellen, Erbmaterial im <b>Zellkern</b>, Zellfäden</td></tr>
<tr><td><b>Vermehrung</b></td><td>nur in einer <b>Wirtszelle</b>: Virus programmiert die Zelle um, sie baut neue Viren und platzt</td><td>selbstständig durch Teilung</td><td>selbstständig</td></tr>
<tr><td><b>Beispiele</b></td><td>Grippe, Erkältung, Masern, Windpocken, HIV, Herpes</td><td>Scharlach, Tetanus, Keuchhusten, Tripper, Salmonellen</td><td>Fusspilz, Nagelpilz, Scheidenpilz</td></tr></table></div>
<p><b>Infektion</b> = Ansteckung mit einem Krankheitserreger. Bei der <b>Tröpfcheninfektion</b> sind die Erreger in winzigen Tröpfchen der Ausatemluft (Husten, Niesen, Sprechen). Eine andere Person atmet sie ein und steckt sich an, z. B. mit Grippe.</p>
<p><b>Antibiotika</b> hemmen oder töten <b>Bakterien</b>. Gegen <b>Viren</b> wirken sie <b>nicht</b>. Jedes Antibiotikum wirkt nur gegen bestimmte Bakterien. Nimm es genau so lange und so viel, wie die Ärztin oder der Arzt sagt.</p>
<p><b>Pilz mikroskopieren</b> (AM 3.6): Beim Schimmelpilz siehst du Zellfäden und ein Geflecht. Zeichne nur, was du siehst, mit Bleistift, beschrifte mit Linien und notiere die Vergrösserung.</p>
<div class="merk">Viele Bakterien sind nützlich, z. B. Darmbakterien für die Verdauung oder Bakterien für Joghurt.</div>`,
ex:[
{t:'match',b:'Wissen',g:8,q:'Wer verursacht die Krankheit?',l:['Grippe','Fusspilz','Tetanus','Masern','Scharlach'],o:['Virus','Bakterium','Pilz'],a:[0,2,1,0,1]},
{t:'mc',b:'Verstehen',g:9,q:'Wie läuft eine Tröpfcheninfektion ab?',o:['Erreger in der Ausatemluft einer kranken Person werden von einer anderen Person eingeatmet.','Erreger gelangen über verdorbenes Essen in den Darm.','Erreger werden durch einen Mückenstich übertragen.','Erreger dringen durch eine Wunde ein.'],a:0},
{t:'multi',b:'Analysieren',g:10,q:'Welche Aussagen treffen nur auf Viren zu (nicht auf Bakterien)?',o:['Sie sind keine Zellen.','Sie vermehren sich nur in Wirtszellen.','Sie haben keinen eigenen Stoffwechsel.','Sie haben Erbmaterial.','Sie können Krankheiten auslösen.'],a:[0,1,2],e:'Erbmaterial haben beide, und beide können krank machen.'},
{t:'tf',b:'Wissen',g:12,q:'Gegen eine Grippe hilft ein Antibiotikum.',a:false,e:'Grippe wird von Viren verursacht. Antibiotika wirken nur gegen Bakterien.'},
{t:'mc',b:'Anwenden',g:12,q:'Tim hört nach drei Tagen mit dem Antibiotikum auf, weil es ihm besser geht. Was ist das Problem?',o:['Das Antibiotikum wirkt vielleicht nicht richtig, und Bakterien können überleben.','Er wird gegen Viren immun.','Er bekommt sicher eine Allergie.','Es gibt kein Problem.'],a:0},
{t:'mc',b:'Wissen',g:11,q:'Was gehört zu einer korrekten Mikroskopzeichnung?',o:['Bleistift, nur Gesehenes zeichnen, Beschriftung mit Linien, Vergrösserung angeben','Farbstift und schöne Schattierungen','Alles aus dem Buch abzeichnen','Nur die Beschriftung, keine Zeichnung'],a:0}
],
w:[{q:'Vergleiche Viren und Bakterien in Grösse, Aufbau und Vermehrung (Tabelle).',a:'Grösse: Viren 0,02–0,3 µm, Bakterien 0,2–10 µm. Aufbau: Viren = Proteinhülle mit Erbmaterial, keine Zelle; Bakterien = eine Zelle mit Erbmaterial. Vermehrung: Viren nur in Wirtszellen; Bakterien selbstständig durch Teilung.'}]},
t35:{nr:'3.5',title:'Das Immunsystem',book:'S. 56–59',
theory:`<p>Das <b>Immunsystem</b> ist das Abwehrsystem des Körpers. Die wichtigsten Abwehrzellen sind verschiedene <b>weisse Blutzellen</b>.</p>
<p><b>Unspezifische Immunantwort:</b> <b>Fresszellen</b> verlassen die Blutbahn, «fressen» Krankheitserreger und verdauen sie. Danach <b>präsentieren</b> sie die <b>Antigene</b> des Erregers auf ihrer Oberfläche. Fresszellen bekämpfen jede Art von Erreger, sie sind nicht spezialisiert.</p>
<p><b>Antigene</b> sind spezielle Strukturen an der Oberfläche von Zellen und Erregern. <b>Antikörper</b> sind Proteine, die genau zu einem Antigen passen, wie ein <b>Schlüssel zum Schloss</b>.</p>
<p><b>Spezifische Immunantwort</b> (gezielt gegen einen Erreger):</p>
<div class="flow"><span>Fresszelle präsentiert Antigen</span><i>→</i><span>T-Helferzelle aktiviert</span><i>→</i><span>B-Zellen bilden Antikörper</span><i>→</i><span>Antigen-Antikörper-Komplex</span><i>→</i><span>Fresszelle baut ihn ab</span></div>
<ul><li>Einige B-Zellen werden zu <b>B-Gedächtniszellen</b>: Beim nächsten Kontakt bildet der Körper sofort Antikörper. Man ist <b>immun</b>.</li><li><b>T-Killerzellen</b> zerstören Körperzellen, die von Viren befallen sind (auch Krebszellen).</li></ul>
<p><b>Blutgruppen</b> (AB0-System): Sie unterscheiden sich durch die Antigene auf den roten Blutzellen.</p>
<div class="tblwrap"><table class="t"><tr><th>Blutgruppe</th><th>Antigene auf roten Blutzellen</th><th>Antikörper im Plasma</th></tr>
<tr><td>A</td><td>A</td><td>Anti-B</td></tr><tr><td>B</td><td>B</td><td>Anti-A</td></tr><tr><td>AB</td><td>A und B</td><td>keine</td></tr><tr><td>0</td><td>keine</td><td>Anti-A und Anti-B</td></tr></table></div>
<div class="merk">Trifft Anti-A auf Antigen A (oder Anti-B auf B), verklumpt das Blut. Darum muss bei einer Blutübertragung die Blutgruppe passen.</div>`,
ex:[
{t:'mc',b:'Verstehen',g:13,q:'Wie bekämpfen Fresszellen Krankheitserreger?',o:['Sie nehmen die Erreger auf, verdauen sie und präsentieren deren Antigene.','Sie bilden Antikörper gegen genau einen Erreger.','Sie speichern Informationen über den Erreger.','Sie zerstören nur Krebszellen.'],a:0},
{t:'match',b:'Wissen',g:14,q:'Ordne die Zelle ihrer Aufgabe zu.',l:['Fresszelle','T-Helferzelle','B-Zelle','B-Gedächtniszelle','T-Killerzelle'],o:['frisst Erreger und präsentiert Antigene','aktiviert B-Zellen und T-Killerzellen','bildet Antikörper','speichert Informationen über den Erreger','zerstört befallene Körperzellen'],a:[0,1,2,3,4]},
{t:'mc',b:'Verstehen',g:14,q:'Was bedeutet «Schlüssel-Schloss-Prinzip»?',o:['Jeder Antikörper passt genau zu einem bestimmten Antigen.','Jeder Antikörper passt zu allen Erregern.','Fresszellen schliessen Erreger ein.','Antigene öffnen die Zellen.'],a:0},
{t:'mc',b:'Analysieren',g:14,q:'Warum wird man an Windpocken meist nur einmal krank?',o:['B-Gedächtniszellen erkennen den Erreger sofort, und Antikörper werden schnell gebildet.','Das Virus stirbt nach der ersten Krankheit aus.','Fresszellen werden nach der Krankheit grösser.','Man hat danach keine Antigene mehr.'],a:0},
{t:'match',b:'Wissen',g:15,q:'Welche Antigene haben die roten Blutzellen?',l:['Blutgruppe A','Blutgruppe B','Blutgruppe AB','Blutgruppe 0'],o:['Antigen A','Antigen B','Antigen A und B','keine Antigene'],a:[0,1,2,3]},
{t:'mc',b:'Anwenden',g:15,q:'Ein Patient mit Blutgruppe A bekommt Blut der Gruppe B. Was passiert?',o:['Seine Anti-B-Antikörper verklumpen die fremden roten Blutzellen.','Nichts, alle Blutgruppen passen zusammen.','Er wird zur Blutgruppe AB.','Sein Blut wird dünner.'],a:0}
],
w:[{q:'Zeichne eine Skizze (Pfeilkette) der spezifischen Immunantwort und erkläre sie in 3–4 Sätzen.',a:'Fresszelle frisst Erreger und präsentiert Antigene → T-Helferzelle erkennt das Antigen und aktiviert B-Zellen (und T-Killerzellen) → B-Zellen vermehren sich und bilden passende Antikörper → Antikörper binden an Antigene (Antigen-Antikörper-Komplex) → Fresszellen bauen die Komplexe ab. Einige B-Zellen werden zu Gedächtniszellen. T-Killerzellen zerstören befallene Körperzellen.'}]},
t36:{nr:'3.6',title:'Impfungen',book:'S. 60–61',
theory:`<div class="tblwrap"><table class="t"><tr><th></th><th>Schutzimpfung (aktive Immunisierung)</th><th>Heilimpfung (passive Immunisierung)</th></tr>
<tr><td><b>Impfstoff</b></td><td>abgeschwächte Erreger oder einzelne Antigene</td><td>fertige Antikörper (meist aus dem Blut von Tieren gewonnen)</td></tr>
<tr><td><b>Wer bildet die Antikörper?</b></td><td>der eigene Körper (aktiv)</td><td>niemand, sie werden von aussen gegeben (passiv)</td></tr>
<tr><td><b>Gedächtniszellen</b></td><td>ja</td><td>nein</td></tr>
<tr><td><b>Wann?</b></td><td>vorbeugend, vor einer Ansteckung (z. B. Säuglinge gegen Masern)</td><td>wenn jemand schon krank ist, oder kurz vor einer Reise</td></tr>
<tr><td><b>Schutzdauer</b></td><td>lange (Jahre, teils lebenslang), manchmal Auffrischung nötig</td><td>kurz, kein dauerhafter Schutz</td></tr></table></div>
<p><b>Impfausweis</b> (AM 3.10): Er zeigt, gegen welche Krankheiten jemand wann geimpft wurde. Eingetragen sind Datum, Impfstoff und Krankheit. So sieht man, ob eine <b>Auffrischungsimpfung</b> nötig ist.</p>
<p><b>Grippeimpfung:</b> Die Antigene der Grippeviren verändern sich jedes Jahr stark. Die alten Gedächtniszellen erkennen das neue Virus nicht mehr. Darum braucht es jedes Jahr einen neuen Impfstoff.</p>`,
ex:[
{t:'multi',b:'Verstehen',g:17,q:'Welche Aussagen gelten für die Schutzimpfung (aktive Immunisierung)?',o:['Der Körper bildet selbst Antikörper.','Es entstehen B-Gedächtniszellen.','Der Schutz hält lange.','Es werden fertige Antikörper gespritzt.','Sie hilft vor allem, wenn man schon krank ist.'],a:[0,1,2]},
{t:'mc',b:'Anwenden',g:17,q:'Jemand wird von einem Hund gebissen, der Tollwut haben könnte, und ist nicht geimpft. Welche Impfung hilft sofort?',o:['Heilimpfung (passive Immunisierung)','Schutzimpfung (aktive Immunisierung)','Keine Impfung, nur Antibiotika','Die Grippeimpfung'],a:0,e:'Fertige Antikörper wirken sofort. Der Körper braucht für eigene Antikörper zu lange.'},
{t:'tf',b:'Verstehen',g:17,q:'Bei der Heilimpfung entstehen Gedächtniszellen, darum schützt sie lebenslang.',a:false},
{t:'mc',b:'Analysieren',g:17,q:'Warum muss man sich jedes Jahr neu gegen Grippe impfen?',o:['Die Antigene der Grippeviren verändern sich, die Gedächtniszellen erkennen sie nicht mehr.','Der Impfstoff wird im Körper sofort abgebaut.','Grippe wird von Bakterien verursacht.','Gedächtniszellen leben nur einen Tag.'],a:0},
{t:'mc',b:'Anwenden',g:16,q:'Im Impfausweis steht bei Tetanus die letzte Impfung vor 20 Jahren. Was bedeutet das?',o:['Der Schutz kann nachlassen, eine Auffrischungsimpfung ist sinnvoll.','Man ist sicher lebenslang geschützt.','Man hatte Tetanus.','Man darf nie mehr geimpft werden.'],a:0}
],
w:[{q:'Erstelle eine Tabelle: Schutzimpfung und Heilimpfung (Impfstoff, Wer bildet Antikörper?, Gedächtniszellen, Schutzdauer).',a:'Siehe Tabelle in der Theorie: Schutzimpfung = abgeschwächte Erreger, Körper bildet Antikörper selbst, Gedächtniszellen ja, langer Schutz. Heilimpfung = fertige Antikörper, keine eigene Bildung, keine Gedächtniszellen, kurzer Schutz.'}]},
t37:{nr:'3.7',title:'Sexuell übertragbare Infektionen',book:'S. 62–63',
theory:`<p><b>STI</b> (sexually transmitted infections) werden bei sexuellen Aktivitäten übertragen: über <b>Körperflüssigkeiten</b> (Sperma, Scheidenflüssigkeit, Blut) oder über den <b>Kontakt von Schleimhäuten</b> (Scheide, Penis, Mund).</p>
<p><b>Schutz:</b> Kondom oder Femidom bei allen sexuellen Aktivitäten. Gegen HPV und Hepatitis B gibt es zusätzlich eine <b>Impfung</b>. Die Pille, die Spirale und andere Verhütungsmittel verhindern nur eine Schwangerschaft, sie schützen <b>nicht</b> vor STI.</p>
<p><b>Mögliche Anzeichen:</b> Brennen beim Urinieren, Ausfluss aus Scheide oder Penis, Juckreiz, Rötungen oder Bläschen. Viele STI verlaufen aber lange <b>ohne Anzeichen</b>, und man kann trotzdem andere anstecken. Bei Anzeichen immer zur Ärztin oder zum Arzt, denn unbehandelt drohen bleibende Schäden wie Unfruchtbarkeit.</p>
<div class="tblwrap"><table class="t"><tr><th>Erreger</th><th>STI</th><th>Behandlung</th></tr>
<tr><td>Bakterien</td><td>Chlamydien, Tripper (Gonorrhö), Syphilis</td><td>heilbar mit Antibiotika</td></tr>
<tr><td>Viren</td><td>Herpes, HPV, Hepatitis B, HIV</td><td>nicht heilbar; Beschwerden lindern bzw. Ausbruch von Aids verhindern; Impfung gegen HPV und Hepatitis B</td></tr></table></div>`,
ex:[
{t:'multi',b:'Wissen',g:18,q:'Wodurch kann man sich mit einer STI anstecken?',o:['Austausch von Sperma oder Scheidenflüssigkeit','Kontakt von Schleimhäuten, auch beim Oralverkehr','Blut','Händeschütteln'],a:[0,1,2]},
{t:'tf',b:'Verstehen',g:18,q:'Mara nimmt die Pille. Sie ist damit auch vor STI geschützt.',a:false,e:'Die Pille verhindert nur eine Schwangerschaft. Vor STI schützen Kondom und Femidom.'},
{t:'multi',b:'Wissen',g:19,q:'Welche Anzeichen können auf eine STI hinweisen?',o:['Brennen beim Urinieren','Ausfluss','Bläschen oder Rötungen im Intimbereich','Schnupfen','Juckreiz'],a:[0,1,2,4]},
{t:'tf',b:'Verstehen',g:19,q:'Samuel: «Der Ausschlag ist von selbst verschwunden, also muss ich nicht zum Arzt.»',a:false,e:'Anzeichen können verschwinden, die Infektion bleibt. Unbehandelt drohen Schäden, und er kann andere anstecken.'},
{t:'match',b:'Wissen',g:18,q:'Ist die STI mit Antibiotika heilbar?',l:['Chlamydien','HIV','Syphilis','Herpes'],o:['ja, mit Antibiotika','nein, nicht heilbar'],a:[0,1,0,1]}
],
w:[{q:'Erkläre einer Kollegin, wie man sich vor STI schützen kann, und warum die Pille dafür nicht reicht.',a:'Kondom oder Femidom bei allen sexuellen Aktivitäten, dazu Impfungen gegen HPV und Hepatitis B. Die Pille verhindert nur die Schwangerschaft. Sie verhindert nicht, dass Körperflüssigkeiten ausgetauscht werden, darum schützt sie nicht vor STI.'}]},
t38:{nr:'3.8',title:'Krebs',book:'S. 64',
theory:`<p>Im Körper werden abgestorbene Zellen durch neue ersetzt. Manchmal gerät die Zellteilung <b>ausser Kontrolle</b>. Normalerweise erkennt das Immunsystem solche Zellen und zerstört sie. Gelingt das nicht, entsteht eine Geschwulst, ein <b>Tumor</b>.</p>
<div class="tblwrap"><table class="t"><tr><th>Gutartiger Tumor</th><th>Bösartiger Tumor (Krebs)</th></tr>
<tr><td>bleibt am Entstehungsort</td><td>wächst in das gesunde Gewebe hinein</td></tr>
<tr><td>breitet sich nicht aus</td><td>Zellen gelangen über die Blutbahn an andere Orte und bilden <b>Metastasen</b> (Ableger)</td></tr></table></div>
<p><b>Krebsrisiko senken:</b> nicht rauchen (Lungenkrebs), guter Sonnenschutz (Hautkrebs), gesund leben mit ausgewogener Ernährung und Bewegung, HPV-Impfung, Vorsorgeuntersuchungen. Je früher Krebs entdeckt wird, desto grösser sind die Heilungschancen.</p>`,
ex:[
{t:'match',b:'Verstehen',g:20,q:'Gutartig oder bösartig?',l:['bildet Metastasen','bleibt am Entstehungsort','wächst ins gesunde Gewebe','breitet sich nicht aus'],o:['gutartiger Tumor','bösartiger Tumor'],a:[1,0,1,0]},
{t:'mc',b:'Wissen',g:20,q:'Was sind Metastasen?',o:['Neue Tumore an anderen Stellen, entstanden aus verschleppten Krebszellen','Weisse Blutzellen, die Krebs bekämpfen','Gutartige Geschwulste','Medikamente gegen Krebs'],a:0},
{t:'multi',b:'Anwenden',g:21,q:'Welche Massnahmen senken das Krebsrisiko?',o:['Nicht rauchen','Sonnenschutz','Vorsorgeuntersuchungen','Häufig Solarium','HPV-Impfung'],a:[0,1,2,4]},
{t:'mc',b:'Analysieren',g:20,q:'Warum ist ein bösartiger Tumor gefährlicher als ein gutartiger?',o:['Er streut über das Blut im ganzen Körper und zerstört gesundes Gewebe.','Er ist immer grösser.','Er wächst nur langsam.','Er entsteht nur in der Lunge.'],a:0}
],
w:[{q:'Nenne zwei Massnahmen gegen Krebs und begründe jeweils, gegen welche Krebsart sie helfen.',a:'Zum Beispiel: Nicht rauchen senkt das Risiko für Lungenkrebs. Sonnenschutz senkt das Risiko für Hautkrebs. HPV-Impfung schützt vor Gebärmutterhalskrebs.'}]},
t39:{nr:'3.9',title:'Medikamente',book:'S. 65',
theory:`<p>Richtig angewendet helfen Medikamente, Krankheiten zu heilen und Schmerzen zu lindern. Wie man ein Medikament anwendet, steht im <b>Beipackzettel</b>:</p>
<ul><li><b>Anwendungsgebiet:</b> Wogegen hilft es?</li><li><b>Dosierung:</b> Wie viel, wie oft, wie lange? (z. B. «Erwachsene und Jugendliche ab 12 Jahren: 1 Tablette, höchstens 3-mal täglich»)</li><li><b>Nebenwirkungen:</b> Welche unerwünschten Wirkungen sind möglich?</li><li><b>Gegenanzeigen</b> und <b>Wechselwirkungen</b> mit anderen Medikamenten</li></ul>
<div class="tblwrap"><table class="t"><tr><th>Medikamentenmissbrauch</th><th>Medikamentenabhängigkeit</th></tr>
<tr><td>Ein gesunder Mensch nimmt Medikamente ohne Notwendigkeit, und es wird zur Gewohnheit.</td><td>Der Körper verlangt nach dem Medikament. Man braucht immer mehr für die gleiche Wirkung und kommt ohne es nicht mehr aus.</td></tr></table></div>
<p>Abhängig machen können z. B. bestimmte <b>Schlaf- und Beruhigungsmittel</b>, einige <b>Schmerzmittel</b>, <b>Aufputschmittel</b> und bestimmte <b>Hustenmittel</b>. Sie dürfen nie lange ohne Pause eingenommen werden. Bei Fragen helfen Apothekerinnen und Apotheker.</p>
<div class="merk">Missbrauch ist der Schritt vor der Abhängigkeit.</div>`,

t310:{nr:'3.10',title:'Gesund sein und bleiben',book:'S. 66–67',
theory:`<p><b>Gesundheit</b> heisst nicht nur, körperlich gesund zu sein, sondern sich als ganzer Mensch <b>wohlzufühlen</b>. Stress, Ausgrenzung oder Angst beeinflussen das Wohlbefinden genauso wie körperliche Beschwerden.</p>
<p><b>Mobbing:</b> Eine Person wird von einer anderen oder einer Gruppe <b>wiederholt und über längere Zeit</b> schikaniert. Merkmale sind zum Beispiel:</p>
<ul><li>abschätzig behandeln oder vor anderen blossstellen</li><li>beschimpfen oder anschreien</li><li>wie Luft behandeln, übergehen</li><li>Gerüchte verbreiten, schlecht über jemanden reden</li><li>herumschubsen oder anpöbeln</li></ul>
<div class="tblwrap"><table class="t"><tr><th></th><th>Schutzfaktoren (stärken)</th><th>Risikofaktoren (vermeiden)</th></tr>
<tr><td><b>innere</b> (bei mir selbst)</td><td>gesunde Ernährung, genug Bewegung, Verzicht auf Suchtmittel, Wechsel von Stress und Entspannung</td><td>Rauchen, Alkohol, Bewegungsmangel, Dauerstress, wenig Schlaf</td></tr>
<tr><td><b>äussere</b> (Umfeld)</td><td>Unterstützung und Anerkennung in Familie und bei Freunden, intakte Umwelt</td><td>Mobbing, Streit, Lärm, verschmutzte Umwelt</td></tr></table></div>`,

}

    const pct=Math.round(n/TEST.length*100);
    const tips=Object.keys(miss).map(k=>'<a class="go" style="display:inline-block;margin:3px" href="#'+k+'">'+(k==='test'?'Fallbeispiele':T[k].nr+' '+T[k].title)+' ('+miss[k]+')</a>').join(' ');
    $('#res').innerHTML='<div class="box" style="margin-top:16px"><div class="score">'+n+' / '+TEST.length+'</div><p style="margin:4px 0 10px">'+(pct>=80?'Sehr gut! Du bist gut vorbereitet.':pct>=60?'Gut! Wiederhole die Themen unten noch einmal.':'Übe die Themen unten nochmals mit Theorie und Übungen.')+(open?' ('+open+' Aufgaben nicht beantwortet.)':'')+'</p>'+(tips?'<div style="font-weight:600;margin-bottom:4px">Noch üben:</div>'+tips:'')+'</div>';
    $('#res').scrollIntoView({behavior:'smooth',block:'start'});
  });
}
function route(){
  let h=(location.hash||'').slice(1);if(!T[h]&&h!=='test')h='lernziele';
  nav(h);if(h==='lernziele')viewStart();else if(h==='test')viewTest();else viewTopic(h);
  $('#side').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');window.scrollTo(0,0);
}
$('#menuBtn').addEventListener('click',()=>{const o=$('#side').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',route);route();
</script>
